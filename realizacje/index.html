<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Realizacje · Emil Wiktorski</title>
<meta name="description" content="Strony, sklepy i aplikacje, które zaprojektowałem i zbudowałem.">
<link rel="icon" href="/assets/projekty/favicon.png">
<style>
@font-face{font-family:Sg;font-weight:400;font-display:swap;src:url(/assets/fonty/schibsted-grotesk-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:Sg;font-weight:400;font-display:swap;src:url(/assets/fonty/schibsted-grotesk-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02AF}
@font-face{font-family:Sg;font-weight:600;font-display:swap;src:url(/assets/fonty/schibsted-grotesk-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:Sg;font-weight:600;font-display:swap;src:url(/assets/fonty/schibsted-grotesk-latin-ext-600-normal.woff2) format('woff2');unicode-range:U+0100-02AF}
@font-face{font-family:Is;font-weight:400;font-display:swap;src:url(/assets/fonty/instrument-serif-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:Is;font-weight:400;font-display:swap;src:url(/assets/fonty/instrument-serif-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02AF}
@font-face{font-family:Is;font-style:italic;font-weight:400;font-display:swap;src:url(/assets/fonty/instrument-serif-latin-400-italic.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:Is;font-style:italic;font-weight:400;font-display:swap;src:url(/assets/fonty/instrument-serif-latin-ext-400-italic.woff2) format('woff2');unicode-range:U+0100-02AF}
:root{--bg:#efeae0;--tx:#16171b;--tx2:#6b6a66;--a:#2448d8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:400 16px/1.55 Sg,system-ui,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:16px clamp(18px,4vw,48px);background:rgba(239,234,224,.88);backdrop-filter:blur(10px)}
.top .nm{font-weight:600;font-size:17px}
.top nav{display:flex;gap:10px;align-items:center}
.top .ul{font-size:14px;color:var(--tx2);padding:0 10px}
.top .kt{height:42px;padding:0 20px;border-radius:99px;background:var(--tx);color:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center}
.w{max-width:1220px;margin:0 auto;padding:0 clamp(18px,4vw,48px)}
.hd{padding:70px 0 34px}
.hd h1{font:400 clamp(48px,7vw,96px)/.95 Is,serif;letter-spacing:-.02em}
.hd h1 em{color:var(--a)}
.hd p{max-width:560px;margin-top:18px;color:var(--tx2);font-size:18px}
.fl{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 30px}
.fl button{height:38px;padding:0 16px;border-radius:99px;border:1.5px solid #d6d1c5;background:#fff;font-weight:600;font-size:14px;transition:all .2s}
.fl button.on{background:var(--tx);border-color:var(--tx);color:#fff}
.fl button span{opacity:.5;margin-left:4px;font-weight:400}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:28px 24px;padding-bottom:90px}
.cd{display:block}
.fr{position:relative;border-radius:14px;background:#fff;padding:8px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 24px 60px -28px rgba(20,22,27,.45);transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s}
.cd:hover .fr{transform:translateY(-6px);box-shadow:0 1px 0 rgba(0,0,0,.04),0 36px 80px -30px rgba(20,22,27,.55)}
.bar{display:flex;align-items:center;gap:6px;height:22px;padding:0 6px}
.bar i{width:8px;height:8px;border-radius:50%;background:#e2ded5}
.bar span{margin-left:8px;font-size:11.5px;color:#9a978f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{position:relative;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:#111}
.sc img,.sc video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.sc img.ct{object-fit:contain;background:#f4f1ea}
.sc video{opacity:0;transition:opacity .35s}
.cd.pl .sc video{opacity:1}
.mt{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px 6px 0}
.mt .ty{font-size:13px;color:var(--tx2)}
.mt h2{font:400 34px/1 Is,serif;margin-top:6px}
.mt p{color:#4a4a47;font-size:15px;margin-top:8px;max-width:46ch}
.bd{flex:none;font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;background:#f1eee8;color:#6b5b3a;white-space:nowrap;margin-top:2px}
.bd.on{background:#e7f2ec;color:#1f7a4d}
.go{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-weight:600;font-size:14px;color:var(--a)}
.go i{font-style:normal;transition:transform .3s}.cd:hover .go i{transform:translateX(4px)}
.cta{border-top:1px solid #dcd6c9;padding:60px 0 80px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.cta h2{font:400 clamp(34px,4.4vw,56px)/1 Is,serif}
.cta .bt{display:flex;gap:10px;flex-wrap:wrap}
.cta a{height:50px;padding:0 24px;border-radius:99px;font-weight:600;display:inline-flex;align-items:center}
.cta a.p{background:var(--a);color:#fff}.cta a.o{border:1.5px solid var(--tx)}
@media (max-width:820px){.gr{grid-template-columns:1fr}.top .ul{display:none}.hd{padding-top:40px}}
</style>
</head>
<body>
<header class="top"><a class="nm" href="/">Emil Wiktorski</a><nav><a class="ul" href="/ulica/">Ulica stron</a><a class="kt" href="/#kontakt">Kontakt</a></nav></header>
<main class="w">
 <div class="hd"><h1>Moje <em>realizacje</em>.</h1><p>Strony, sklepy i aplikacje, które zaprojektowałem i zbudowałem. Najedź na projekt, żeby zobaczyć go w ruchu. Kliknij, żeby otworzyć.</p></div>
 <div class="fl" id="fl"></div>
 <div class="gr" id="gr"></div>
 <div class="cta"><h2>Chcesz taką dla swojej firmy?</h2><div class="bt"><a class="p" href="/kreator/">Zobacz swoją w kreatorze</a><a class="o" href="/#kontakt">Napisz do mnie</a></div></div>
</main>
<script>
/* pokaz:true = widoczne na stronie. Firmy z prawdziwą nazwą włączaj dopiero za ich zgodą.
   stan: "dziala" = projekt działa naprawdę, "koncepcja" = projekt pokazowy */
var R=[
 {k:'detailing',typ:'strona',ty:'Strona www · Detailing',n:'Lustro',p:'Film w tle, suwak przed i po korekcie lakieru, pakiety z cenami.',url:'/demo/detailing/',stan:'koncepcja',pokaz:true},
 {k:'linia-wody',typ:'strona',ty:'Strona www · Wynajem i sprzedaż łodzi',n:'Linia Wody',p:'Film sterowany przewijaniem: kamera cofa się z salonu jachtu i wylatuje nad rufę.',url:'/demo/linia-wody/',stan:'koncepcja',pokaz:true},
 {k:'wz',typ:'aplikacja',ty:'Aplikacja · Zaproszenia online',n:'Wystarczy Zaprosić',p:'Zaproszenia na komunię i chrzest, które goście otwierają bez instalowania aplikacji.',url:'https://wystarczyzaprosic.pl/',stan:'dziala',pokaz:true},
 {k:'korektor-lektorski',img:'vid/korektor-lektorski.webp',typ:'aplikacja',ty:'Aplikacja · Studia nagrań',n:'Korektor Lektorski',p:'Porównuje nagranie lektora z tekstem i zaznacza w PDF miejsca, gdzie przeczytał inaczej.',url:'https://korektorlektorski.pl/',stan:'dziala',pokaz:true},
 {k:'kawa',typ:'strona',ty:'Strona www · Palarnia i kawiarnia',n:'Ranek',p:'Ciemny, ciepły klimat palarni, menu i kawa na wynos.',url:'/demo/kawa/',stan:'koncepcja',pokaz:true},
 {k:'kawiarnia',typ:'strona',ty:'Strona www · Kawiarnia',n:'Pierwszy Łyk',p:'Menu, godziny i zdjęcia, które od razu przypominają smak porannej kawy.',url:'/demo/kawiarnia/',stan:'koncepcja',pokaz:true},
 {k:'onyx',typ:'strona',ty:'Strona www · Detailing, Anglia',n:'ONYX Design',p:'Drift sterowany przewijaniem, suwak przed i po wnętrza.',url:'/demo/onyx/',stan:'koncepcja',pokaz:false},
 {k:'gravity',typ:'strona',ty:'Strona www · Kolarstwo grawitacyjne',n:'Gravity ŁDZ',p:'Strona klubu kolarstwa grawitacyjnego na łódzkich Radarach.',url:'/demo/gravity/',stan:'koncepcja',pokaz:false},
 {k:'morning',typ:'strona',ty:'Strona www · Śniadania i kawa',n:'MORNING',p:'Menu śniadaniowe, oceny z Google i rezerwacja stolika.',url:'/demo/morning/',stan:'koncepcja',pokaz:false},
 {k:'marriedkate',typ:'strona',ty:'Strona www · Dekoracje ślubne',n:'Married Kate',p:'Realizacje dekoracji sal i wycena terminu.',url:'/demo/marriedkate/',stan:'koncepcja',pokaz:false},
 {k:'maxx-audio',typ:'strona',ty:'Strona www · Studio nagrań',n:'Maxx-Audio',p:'Głosy lektorów do odsłuchania od razu na stronie.',url:'/demo/maxx-audio/',stan:'koncepcja',pokaz:false},
 {k:'benesz',typ:'strona',ty:'Strona www · Psycholog sportu',n:'Jan Benesz',p:'Szum myśli, który cichnie przy przewijaniu.',url:'/demo/benesz/',stan:'koncepcja',pokaz:false},
 {k:'dj',typ:'strona',ty:'Strona www · DJ',n:'DJ Wojciech',p:'Film wyłaniający się z dymu i cennik z podglądem imprez.',url:'/demo/dj/',stan:'koncepcja',pokaz:false},
 {k:'gremium',typ:'strona',ty:'Strona www · Kredyty',n:'Gremium Kredyty',p:'Kalkulator raty na starcie i porównanie ofert banków.',url:'/demo/gremium/',stan:'koncepcja',pokaz:false},
 {k:'b2b',typ:'sklep',ty:'Sklep i hurt · Moda',n:'By o la la',p:'Sklep dla klientek i hurt dla butików: obrót 360°, panel opisów z AI.',url:'/demo/b2b/',stan:'koncepcja',pokaz:false},
 {k:'kompostowniki',typ:'sklep',ty:'Sklep internetowy · Ogród',n:'EKOBAT',p:'Sklep producenta kompostowników.',url:'/demo/kompostowniki/',stan:'koncepcja',pokaz:false},
 {k:'fips',typ:'strona',ty:'Strona www · Fundacja',n:'FIPS',p:'Wsparcie dla małych i średnich firm.',url:'/demo/fips/',stan:'koncepcja',pokaz:false},
 {k:'cleanluk',typ:'strona',ty:'Strona www · Detailing',n:'Clean-Luk',p:'Auto kosmetyka w Zgierzu.',url:'/demo/cleanluk/',stan:'koncepcja',pokaz:false},
 {k:'bigboyz',typ:'strona',ty:'Strona www · Detailing',n:'Big Boyz Garage',p:'Detailing przy Manufakturze w Łodzi.',url:'/demo/bigboyz/',stan:'koncepcja',pokaz:false},
 {k:'carcosmetics',typ:'strona',ty:'Strona www · Detailing',n:'Car Cosmetics',p:'Powłoki, folie PPF i detailing w Bełchatowie.',url:'/demo/carcosmetics/',stan:'koncepcja',pokaz:false}
].filter(function(r){return r.pokaz});
var T={wszystkie:'Wszystkie',strona:'Strony',sklep:'Sklepy',aplikacja:'Aplikacje'};
var fl=document.getElementById('fl'),gr=document.getElementById('gr');
fl.innerHTML=Object.keys(T).map(function(k,i){var c=k=='wszystkie'?R.length:R.filter(function(r){return r.typ==k}).length;return c?'<button data-t="'+k+'"'+(i?'':' class="on"')+'>'+T[k]+'<span>'+c+'</span></button>':''}).join('');
function host(u){return /^https?:/.test(u)?u.replace(/^https?:\/\//,'').replace(/\/$/,''):'emilwiktorski.pl'+u.replace(/\/$/,'')}
function draw(t){gr.innerHTML=R.filter(function(r){return t=='wszystkie'||r.typ==t}).map(function(r){var ext=/^https?:/.test(r.url);
 return '<a class="cd" href="'+r.url+'"'+(ext?' target="_blank" rel="noopener"':'')+'><div class="fr"><div class="bar"><i></i><i></i><i></i><span>'+host(r.url)+'</span></div><div class="sc">'+(r.img?'<img class="ct" src="'+r.img+'" alt="'+r.n+'" loading="lazy">':'<img src="vid/'+r.k+'.jpg" alt="'+r.n+'" loading="lazy"><video muted loop playsinline preload="none" src="vid/'+r.k+'.mp4"></video>')+'</div></div>'+
 '<div class="mt"><div><span class="ty">'+r.ty+'</span><h2>'+r.n+'</h2><p>'+r.p+'</p><span class="go">'+(ext?'Otwórz stronę':'Zobacz stronę')+' <i>→</i></span></div><span class="bd'+(r.stan=='dziala'?' on':'')+'">'+(r.stan=='dziala'?'Działa':'Projekt pokazowy')+'</span></div></a>'}).join('');bind()}
var touch=matchMedia('(hover:none)').matches,io;
function play(c,on){var v=c.querySelector('video');if(!v)return;c.classList.toggle('pl',on);if(on){v.preload='auto';var p=v.play();if(p)p.catch(function(){})}else{v.pause();v.currentTime=0}}
function bind(){var cs=[].slice.call(gr.querySelectorAll('.cd'));if(io)io.disconnect();
 if(touch){io=new IntersectionObserver(function(es){es.forEach(function(e){play(e.target,e.isIntersecting)})},{rootMargin:'-30% 0px -30% 0px'});cs.forEach(function(c){io.observe(c)})}
 else cs.forEach(function(c){c.addEventListener('mouseenter',function(){play(c,true)});c.addEventListener('mouseleave',function(){play(c,false)})})}
fl.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call(fl.children,function(x){x.classList.toggle('on',x==b)});draw(b.dataset.t)});
draw('wszystkie');
</script>
</body>
</html>
