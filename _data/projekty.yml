# =====================================================================
#  APLIKACJE POKAZYWANE NA STRONIE GŁÓWNEJ (sekcja "Aplikacje")
#  Dodajesz aplikację, kopiując cały blok zaczynający się od "-"
#  i wklejając go pod spodem. Zachowaj wcięcia i cudzysłowy.
#
#  nazwa      nazwa projektu
#  dla_kogo   krótko, dla kogo jest (pokazuje się nad nazwą)
#  start      kiedy ruszył, np. "kwiecień 2026"
#  opis       jedno, dwa zdania: co robi
#  cechy      2-4 krótkie punkty (opcjonalne)
#  efekt      jedna liczba albo efekt (opcjonalne)
#  url        adres strony projektu
#  film       link do filmu na YouTube (puste = przycisk się nie pokaże)
#  widok      "korektor" pokazuje okno raportu z zaznaczeniami,
#             "zrzut" pokazuje obraz z pola zrzut (ekran telefonu),
#             puste = sam tekst, bez obrazka
#  zrzut      ścieżka do zrzutu ekranu w assets/projekty/
#             (pionowy, z telefonu, np. 1170 x 2532)
# =====================================================================

- nazwa: "Korektor Lektorski"
  dla_kogo: "Dla studiów nagrań i wydawnictw audiobooków"
  start: "kwiecień 2026"
  opis: "Porównuje nagranie lektora z tekstem książki i zaznacza w PDF miejsca, w których lektor przeczytał coś inaczej."
  efekt: "korekta o ok. 70% krótsza"
  url: "https://korektorlektorski.pl/"
  film: ""
  widok: "korektor"

- nazwa: "Wystarczy Zaprosić"
  dla_kogo: "Zaproszenia na komunię, chrzest i bierzmowanie"
  start: "listopad 2026"
  opis: "Zaproszenia online, które goście otwierają bez instalowania aplikacji i zakładania konta."
  cechy:
    - "Imienne zaproszenie dla każdej rodziny, imiona odmieniają się same."
    - "Potwierdzenie obecności jednym kliknięciem."
    - "Lista dla restauracji tworzy się sama: dorośli, dzieci, diety."
  url: "https://wystarczyzaprosic.pl/"
  widok: ""
