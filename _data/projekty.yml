# =====================================================================
#  PROJEKTY POKAZYWANE NA STRONIE GŁÓWNEJ
#  Dodajesz projekt, kopiując cały blok zaczynający się od "-"
#  i wklejając go pod spodem. Zachowaj wcięcia i cudzysłowy.
#
#  nazwa      nazwa projektu
#  opis       jedno zdanie, co robi
#  url        adres strony projektu
#  status     "Live", "Beta" albo "W budowie"
#             (pasek celu na stronie głównej liczy projekty ze statusem "Live")
#  logo       ścieżka do logo w assets/projekty/ (bez logo pokaże się litera)
#  zrzut      ścieżka do zrzutu ekranu aplikacji (bez zrzutu pokaże się
#             logo na kolorze projektu)
#  tlo        kolor okładki karty, gdy nie ma zrzutu
#  narzedzia  lista narzędzi, którymi projekt jest zbudowany
#  przychod   (opcjonalne) przychód, pokaże się na karcie po odkomentowaniu
# =====================================================================

- nazwa: "Korektor Lektorski"
