# =====================================================================
#  "CO ROBIĘ" NA STRONIE GŁÓWNEJ
#  Każdy wiersz to blok zaczynający się od "-". Zachowaj wcięcia
#  i cudzysłowy. Pole "linki" jest opcjonalne.
# =====================================================================

- nazwa: "Strony premium"
  opis: "Strona, która nie wygląda jak z szablonu. Twoje zdjęcia i Twój język, a klient w 5 sekund wie, czym się zajmujesz i jak do Ciebie zadzwonić."
  przyklady: "Na przykład: studio detailingu, salon urody, restauracja, firma remontowa. Wersję podstawową z kreatora pobierasz za darmo."
  kreator: "/kreator/"
  kreator_tekst: "Zobacz swoją stronę w kreatorze"

- nazwa: "Sklepy internetowe"
  opis: "Sklep z Twoimi produktami, cenami i koszykiem. Zaczynasz od prostej wersji z zamówieniami na maila, a płatności online i dostawę dokładam, kiedy sprzedaż ruszy."
  przyklady: "Na przykład: odzież, kosmetyki, rękodzieło, katalog dla klientów hurtowych."
  kreator: "/kreator/?typ=sklep"
  kreator_tekst: "Zobacz swój sklep w kreatorze"

- nazwa: "Aplikacje"
  opis: "Masz w firmie coś, co robicie ręcznie albo w trzech programach naraz? Zbuduję jedną aplikację, która ogarnie to za Was."
  przyklady: "Na przykład: zlecenia i ekipy w terenie, wyceny, panel dla stałych klientów."
  linki_tytul: "Moje aplikacje:"
  linki:
    - nazwa: "Korektor Lektorski"
      url: "https://korektorlektorski.pl/"
    - nazwa: "Wystarczy Zaprosić"
      url: "https://wystarczyzaprosic.pl/"

- nazwa: "Automatyzacje"
  opis: "Rzeczy, które ktoś w firmie robi codziennie ręcznie: przepisywanie danych, raporty, przypomnienia. Ustawiam je tak, żeby działy się same."
  przyklady: "Na przykład: zgłoszenia z formularza prosto do arkusza, raport na maila co poniedziałek, przypomnienia dla klientów."
