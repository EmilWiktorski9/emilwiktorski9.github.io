- nazwa: "Strony premium"
  opis: "Strona, która nie wygląda jak z szablonu. Twoje zdjęcia i Twój język, a klient od razu wie, czym się zajmujesz i jak się z Tobą skontaktować."
  przyklady: "Na przykład: strona firmy usługowej, strona produktu, strona z wyceną i rezerwacją terminu."

- nazwa: "Aplikacje"
