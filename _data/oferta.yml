  przyklady: "Na przykład: zlecenia i ekipy w terenie, wyceny, panel dla stałych klientów."
  linki_tytul: "Moje aplikacje:"
  linki:
    - nazwa: "Korektor Lektorski"
      url: "https://korektorlektorski.pl/"
    - nazwa: "Wystarczy Zaprosić"
      url: "https://wystarczyzaprosic.pl/"

- nazwa: "Automatyzacje"
  opis: "Rzeczy, które ktoś w firmie robi codziennie ręcznie: przepisywanie danych, raporty, przypomnienia. Ustawiam je tak, żeby działy się same."
  przyklady: "Na przykład: zgłoszenia z formularza prosto do arkusza, raport na maila co poniedziałek, przypomnienia dla klientów."
