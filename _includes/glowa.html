<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- assign opis = page.opis | default: site.description -%}
{%- assign adres = page.url | absolute_url -%}
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ opis | strip_html | normalize_whitespace | truncate: 160 }}">
<link rel="canonical" href="{{ adres }}">
<meta property="og:type" content="{% if page.layout == 'wpis' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ opis | strip_html | normalize_whitespace | truncate: 160 }}">
<meta property="og:url" content="{{ adres }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:locale" content="pl_PL">
<meta name="twitter:card" content="summary">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/rss.xml' | absolute_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
<link rel="stylesheet" href="{{ '/assets/styl.css' | relative_url }}">
{%- if page.layout == 'wpis' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ page.title | jsonify }},
  "description": {{ opis | strip_html | normalize_whitespace | truncate: 160 | jsonify }},
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.date | date_to_xmlschema }}",
  "inLanguage": "pl-PL",
  "mainEntityOfPage": { "@type": "WebPage", "@id": {{ adres | jsonify }} },
  "author": { "@type": "Person", "name": {{ site.autor | jsonify }} },
  "publisher": { "@type": "Person", "name": {{ site.autor | jsonify }} }
}
</script>
{%- elsif page.url == '/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ site.title | jsonify }},
  "url": {{ site.url | jsonify }},
  "description": {{ site.description | jsonify }},
  "inLanguage": "pl-PL",
  "author": {
    "@type": "Person",
    "name": {{ site.autor | jsonify }},
    "email": {{ site.email | jsonify }},
    "jobTitle": "Analityk rynku wtórnego biznesów internetowych"
  }
}
</script>
{%- endif %}
</head>
