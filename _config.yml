# Formularz kontaktowy (Formspree). Wklej sam identyfikator formularza,
# czyli końcówkę adresu https://formspree.io/f/XXXXXXXX, np. "xyzabcde".
# Puste = zamiast formularza pokaże się przycisk "Napisz maila".
# Po włączeniu formularza polityka prywatności sama dopisze sekcję o nim.
# Wtedy zmień też datę w linii polityka_aktualizacja na dzień włączenia.
formspree: ""
