# =====================================================================
#  USTAWIENIA STRONY
#  To jedyny plik, w którym zmieniasz rzeczy dotyczące całej strony.
#  Po każdej zmianie zapisz plik i zatwierdź zmiany (commit) na GitHubie.
#  Uwaga: cudzysłowy muszą zostać. Zmieniaj tylko tekst w środku.
# =====================================================================

# --- PODSTAWY ---
title: "Emil Wiktorski"
# Opis w Google i w podglądzie linku na Facebooku i LinkedInie.
description: "Strony premium, aplikacje i automatyzacje dla firm. Buduję je sam, od pierwszej rozmowy do wdrożenia. Łódź."
lang: pl

# --- ADRES STRONY ---------------------------------------------------
# To są dwie najważniejsze linie w całym pliku. Jeśli są źle ustawione,
# strona wczyta się bez wyglądu, jako sam czarny tekst na białym tle.
#
# baseurl to katalog, w którym stoi strona. Zasada jest prosta:
#   repozytorium nazywa się emilwiktorski9.github.io  ->  baseurl: ""
#   repozytorium nazywa się jakkolwiek inaczej        ->  baseurl: "/nazwa-repozytorium"
#   masz podpiętą własną domenę                       ->  baseurl: ""
#
# url to adres bez ukośnika na końcu.
# --------------------------------------------------------------------
url: "https://emilwiktorski.pl"
baseurl: ""

autor: "Emil Wiktorski"
email: "emil@emilwiktorski.pl"

# --- GÓRA STRONY GŁÓWNEJ ---
# Nagłówek jest w trzech kawałkach: środkowe słowo pisze się kursywą
# i podkreśla kreską. Spacje na końcu i na początku kawałków zostają.
naglowek_przed: "Buduję strony i aplikacje "
naglowek_wyroznienie: "dopasowane"
naglowek_po: " do Twojej firmy."
wstep: "Strony, które nie wyglądają jak z szablonu. Aplikacje i automatyzacje, które zdejmują z Ciebie ręczną robotę. Wszystko robię sam, od pierwszej rozmowy do wdrożenia."
miasto: "Łódź"

# --- KONTAKT ---
kontakt_tytul: "Opowiedz, co chcesz usprawnić."
kontakt_opis: "Napisz, czym się zajmujesz i co Cię męczy. Odpiszę i dopytam o szczegóły."
linkedin: "https://www.linkedin.com/in/emil-wiktorski-6273171a4/"
# Wklej pełny adres swojego profilu. Puste = ikona Facebooka się nie pokaże.
facebook: "https://www.facebook.com/emil.wiktorski"

# Formularz kontaktowy (Formspree). Wklej sam identyfikator formularza,
# czyli końcówkę adresu https://formspree.io/f/XXXXXXXX, np. "xyzabcde".
# Puste = zamiast formularza pokaże się przycisk "Napisz maila".
# Po włączeniu formularza polityka prywatności sama dopisze sekcję o nim.
# Wtedy zmień też datę w linii polityka_aktualizacja na dzień włączenia.
formspree: "xjyyakgq"
polityka_aktualizacja: "31.10.2026"

# --- PROJEKTY I OFERTA ---
# Aplikacje dodajesz w pliku _data/projekty.yml.
# Strony (np. projekty pokazowe) w pliku _data/strony.yml.
# Wiersze "Co mogę dla Ciebie zrobić" zmieniasz w pliku _data/oferta.yml.
# Kroki "Jak pracuję" w pliku _data/kroki.yml.

# =====================================================================
#  PONIŻEJ NIC NIE ZMIENIAJ
# =====================================================================
permalink: /:categories/:title/
timezone: Europe/Warsaw
markdown: kramdown
plugins:
  - jekyll-sitemap
  - jekyll-feed
feed:
  path: /rss.xml
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "wpis"
  # Dema dla klientów (folder demo/) nie trafiają do mapy strony dla Google.
  - scope:
      path: "demo"
    values:
      sitemap: false
# Demo zbudowane w Next.js trzyma skrypty w folderze _next, Jekyll domyślnie pomija takie foldery
include:
  - _next

exclude:
  - CLAUDE.md
  - INSTRUKCJA.md
  - SZABLON-WPISU-BLOG.txt
  - Gemfile
  - Gemfile.lock
  - vendor
