# =====================================================================
#  PONIŻEJ NIC NIE ZMIENIAJ
# =====================================================================
permalink: /:categories/:title/
timezone: Europe/Warsaw
markdown: kramdown
plugins:
  - jekyll-sitemap
  - jekyll-feed
feed:
  path: /rss.xml
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "wpis"
exclude:
  - CLAUDE.md
  - INSTRUKCJA.md
  - SZABLON-WPISU-BLOG.txt
  - Gemfile
  - Gemfile.lock
  - vendor
