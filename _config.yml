# =====================================================================
#  USTAWIENIA STRONY
#  To jedyny plik, w którym zmieniasz rzeczy dotyczące całej strony.
#  Po każdej zmianie zapisz plik i zatwierdź zmiany (commit) na GitHubie.
#  Uwaga: cudzysłowy muszą zostać. Zmieniaj tylko tekst w środku.
# =====================================================================

# --- PODSTAWY (uzupełnij, gdy będziesz miał nazwę i domenę) ---
title: "Emil Wiktorski"
description: "Nie umiem programować, a mimo to buduję i wypuszczam własne aplikacje SaaS z pomocą AI. Pokazuję cały proces: co buduję, ile to kosztuje i co się sypie."
lang: pl

# --- ADRES STRONY ---------------------------------------------------
# To są dwie najważniejsze linie w całym pliku. Jeśli są źle ustawione,
# strona wczyta się bez wyglądu, jako sam czarny tekst na białym tle.
#
# baseurl to katalog, w którym stoi strona. Zasada jest prosta:
#   repozytorium nazywa się emilwiktorski9.github.io  ->  baseurl: ""
#   repozytorium nazywa się jakkolwiek inaczej        ->  baseurl: "/nazwa-repozytorium"
#   masz podpiętą własną domenę                       ->  baseurl: ""
#
# url to adres bez ukośnika na końcu.
# --------------------------------------------------------------------
url: "https://emilwiktorski.pl"
baseurl: ""

autor: "Emil Wiktorski"
email: "emil@emilwiktorski.pl"

# --- LEWA KOLUMNA STRONY GŁÓWNEJ ---
bio: "Nie umiem programować. A mimo to buduję i wypuszczam własne aplikacje SaaS, w całości z pomocą AI."
linkedin: "https://www.linkedin.com/in/emil-wiktorski-6273171a4/"

# Zdjęcie profilowe: wrzuć plik do folderu assets i wpisz ścieżkę,
# na przykład "/assets/zdjecie.jpg". Puste = kółko z inicjałami.
zdjecie: ""

# Cel na pasku postępu. Licznik sam liczy projekty ze statusem "Live"
# w pliku _data/projekty.yml.
cel_aplikacji: 10

# --- PROJEKTY ---
# Projekty dodajesz w pliku _data/projekty.yml, nie tutaj.

# --- FORMULARZ ZAPISU ---
# Kod formularza MailerLite jest w pliku _includes/zapis.html.
# Tutaj nic nie zmieniasz.

# =====================================================================
#  PONIŻEJ NIC NIE ZMIENIAJ
# =====================================================================
permalink: /:categories/:title/
timezone: Europe/Warsaw
markdown: kramdown
plugins:
  - jekyll-sitemap
  - jekyll-feed
feed:
  path: /rss.xml
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "wpis"
exclude:
  - SZABLON-WPISU.txt
  - INSTRUKCJA.md
  - Gemfile
  - Gemfile.lock
  - vendor
